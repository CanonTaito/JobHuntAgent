name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore JobHuntAgent.slnx

      - name: Build
        run: dotnet build JobHuntAgent.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test JobHuntAgent.slnx -c Release --no-restore --logger "console;verbosity=minimal"
